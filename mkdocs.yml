site_name: "GigaSpatial"
site_description: "Acquires published geospatial datasets into a data store you control, loads them for a source, and processes them."
site_author: "Utku Can Ozturk"

theme:
  name: material
  custom_dir: overrides
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  logo: assets/gigaspatial-logo-no-background.png
  favicon: assets/gigaspatial-icon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - navigation.indexes
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

repo_name: giga-spatial
site_url: https://unicef.github.io/giga-spatial
repo_url: https://github.com/unicef/giga-spatial
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Tutorial: getting-started/quickstart.md
      - Datasets: getting-started/datasets.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - user-guide/index.md
      - Points and nearest buildings: user-guide/points-and-buildings.md
      - Population around points: user-guide/population-accessibility.md
      - OSM points of interest: user-guide/osm-places.md
      - Road networks: user-guide/road-networks.md
      - Processing: user-guide/processing.md
      - Settlement: user-guide/settlement-characterization.md
      - Infrastructure files: user-guide/infrastructure-normalization.md
  - Concepts:
      - "Spatial networks": concepts/spatial-networks/index.md
      - Getting a network: concepts/spatial-networks/getting-a-network.md
      - The data model: concepts/spatial-networks/data-model.md
      - Editing: concepts/spatial-networks/editing.md
      - Inserting points: concepts/spatial-networks/inserting-points.md
      - Reduction: concepts/spatial-networks/reduction.md
      - Algorithms: concepts/spatial-networks/algorithms.md
      - Storage and interoperability: concepts/spatial-networks/storage.md
      - Worked use cases: concepts/spatial-networks/use-cases.md
      - Performance and pitfalls: concepts/spatial-networks/performance.md
  - API Reference:
      - api/index.md
      - Handlers: api/handlers.md
      - Fetchers: api/fetchers.md
      - Generators: api/generators.md
      - Grids: api/grid.md
      - Data stores: api/data-stores.md
      - Clients: api/clients.md
      - Boundaries: api/boundaries.md
      - Earth Engine: api/earth-engine.md
      - Processing: api/processing.md
      - Spatial networks: api/network.md
      - Image downloaders: api/image-downloaders.md
      - Handler base: api/handler-base.md
  - Contributing:
      - How to Contribute: contributing.md
  - About:
      - about/index.md
      - Team: about/team.md
      - Roadmap: about/roadmap.md
  - Project:
      - Changelog: changelog.md
      - Design decisions:
          - adr/index.md
          - "Spatial networks and OSM roads: design and algorithms": design/spatial-networks-decisions.md
          - Search key and search geometry: adr/0001-search-key-and-search-geometry.md
          - Handler base in the API reference: adr/0002-handler-base-in-the-api-reference.md
          - Public import paths: adr/0003-public-import-paths.md
          - Columnar spatial network: adr/0004-columnar-spatial-network.md
          - Spatial network storage: adr/0005-spatial-network-storage.md
          - OSM extract storage: adr/0006-osm-extract-storage.md
          - OSM extract choice: adr/0007-osm-extract-choice.md
          - Connection planning: adr/0008-connection-planning.md
      - License: license.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.snippets
  # - pymdownx.emoji:
  #     emoji_index: !!python/name:materialx.emoji.twemoji
  #     emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_submodules: true
            show_root_full_path: false
          filters:
            - "!^_"
          rendering:
            show_source: true
            show_category_heading: true
            show_root_heading: true
            show_signature_annotations: true
  #- git-revision-date-localized:
  #    enable_creation_date: true
  - minify:
      minify_html: true
  - social:
      cards_layout_options:
        background_color: blue
        color: white

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/unicef/giga-spatial
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/giga-spatial/
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/Gigaglobal
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/gigaglobal/
  version:
    provider: mike
    default: latest
    alias: true

  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

copyright: '&copy; Copyright 2025 - , UNICEF Digital Inclusion and Giga, Applied Science Devs'
